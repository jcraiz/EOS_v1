<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a1622" />
      <stop offset="60%" stop-color="#141317" />
      <stop offset="100%" stop-color="#0a090c" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crimsonCurtain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="180" r="220" fill="url(#spotlight)" />

  <!-- Outer Ring Gold Border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldTrim)" stroke-width="4" opacity="0.6" stroke-dasharray="10 8" />

  <!-- Draped Velvet Left & Right -->
  <path d="M40 0 C 90 120, 80 320, 40 512 L 0 512 L 0 0 Z" fill="url(#crimsonCurtain)" opacity="0.8" />
  <path d="M472 0 C 422 120, 432 320, 472 512 L 512 512 L 512 0 Z" fill="url(#crimsonCurtain)" opacity="0.8" />

  <!-- Theatrical Tragedy/Comedy Dual Mask Silhouette -->
  <!-- Comedy Mask (Left) -->
  <g transform="translate(180, 240) rotate(-10)">
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="#201c26" stroke="url(#goldTrim)" stroke-width="7" filter="url(#glow)" />
    <!-- Eyes -->
    <path d="M -50 -35 Q -30 -60 -15 -35 Q -30 -40 -50 -35" fill="url(#goldTrim)" />
    <path d="M 15 -35 Q 30 -60 50 -35 Q 30 -40 15 -35" fill="url(#goldTrim)" />
    <!-- Nose -->
    <path d="M -5 -10 L 0 10 L 10 10" fill="none" stroke="url(#goldTrim)" stroke-width="4" stroke-linecap="round" />
    <!-- Big Smile -->
    <path d="M -50 35 Q 0 85 50 35 Q 0 55 -50 35 Z" fill="url(#crimsonCurtain)" stroke="url(#goldTrim)" stroke-width="4" />
  </g>

  <!-- Tragedy Mask (Right/Front) -->
  <g transform="translate(310, 280) rotate(12)">
    <ellipse cx="0" cy="0" rx="80" ry="100" fill="#261b22" stroke="#fde68a" stroke-width="6" />
    <!-- Eyes -->
    <path d="M -40 -30 Q -25 -10 -10 -30" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" />
    <path d="M 10 -30 Q 25 -10 40 -30" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" />
    <!-- Sad Mouth -->
    <path d="M -40 45 Q 0 10 40 45" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" />
    <!-- Tear -->
    <path d="M 28 -5 C 28 8, 38 8, 38 -5 C 38 -15, 33 -20, 33 -20 C 33 -20, 28 -15, 28 -5 Z" fill="#60a5fa" />
  </g>

  <!-- Star accents -->
  <polygon points="256,70 263,88 282,90 267,103 272,122 256,111 240,122 245,103 230,90 249,88" fill="url(#goldTrim)" />
  <polygon points="120,130 125,142 138,143 128,152 131,165 120,158 109,165 112,152 102,143 115,142" fill="#fde68a" opacity="0.8" />
  <polygon points="390,140 395,152 408,153 398,162 401,175 390,168 379,175 382,162 372,153 385,152" fill="#fde68a" opacity="0.8" />

  <!-- Banner text / Subtitle -->
  <text x="256" y="445" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="4">INGLÉS EN ESCENA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="3">ACT • SPEAK • SHINE</text>
</svg>
